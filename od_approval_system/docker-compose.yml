services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: od_approval_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  web:
    build: .
    command: gunicorn od_approval_system.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  postgres_data:
  media_data:
  static_data:
